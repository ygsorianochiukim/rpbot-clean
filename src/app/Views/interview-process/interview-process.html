<div #messagesContainer class="!h-[100%] absolute w-full overflow-y-scroll flex flex-col p-2 gap-2" style="scrollbar-width:none;">
  <div class="flex-1 w-full p-2 overflow-y-auto text-white rounded-xl" style="scrollbar-width:none;">
    <div *ngFor="let msg of messages" [ngClass]="{'text-right': msg.role === 'user', 'text-left': msg.role === 'assistant'}">
      <div class="w-auto p-3 my-1 rounded-xl" style="max-width: 80%;" [ngClass]="msg.role === 'user' ? 'bg-blue-600 inline-block text-left text-justify' : 'bg-gray-700 inline-block'">
        {{ msg.content }}
      </div>
    </div>
    <div *ngIf="isTyping" class="italic text-black animate-pulse">Interviewer is typing...</div>
  </div>
  <div class="absolute top-0 flex flex-row items-center w-full gap-2 px-2">
    <div class="left-0 w-full h-3 overflow-hidden bg-gray-200 rounded-full">
      <div class="h-full transition-all duration-500"
          [ngClass]="{
            'bg-red-500': progressPercent < 40,
            'bg-yellow-500': progressPercent >= 40 && progressPercent < 80,
            'bg-green-500': progressPercent >= 80
          }"
          [style.width.%]="progressPercent">
      </div>
    </div>

    <div class="text-base font-semibold text-black">
      {{ progressPercent }}%
    </div>
  </div>
  <div *ngIf="!interviewCompleted" class="w-full h-[15%] py-2 flex flex-row gap-2 items-start">
    <textarea [(ngModel)]="userInput"
          placeholder="Interview Response"
          class="w-full h-full p-1 border border-gray-400 outline-none rounded-xl bg-primary"
          (keydown.enter)="sendMessage(); $event.preventDefault()"
          (keydown.shift.enter)="$event.stopPropagation()"
          (paste)="$event.preventDefault()"></textarea>
    <lucide-icon [img]="Send" class="p-1 rounded-md cursor-pointer bg-accent" color="#fff" (click)="sendMessage()"></lucide-icon>
  </div>
  <div *ngIf="showEndButton && !interviewCompleted" class="flex justify-center w-full py-2">
    <button class="px-6 py-2 font-semibold text-white bg-red-600 cursor-pointer rounded-xl text-md" (click)="endInterview()">
      End Interview
    </button>
  </div>
  <div *ngIf="interviewCompleted" class="flex flex-col items-center justify-center w-full gap-2 py-4">
    <div *ngIf="isSaving" class="italic text-gray-600 animate-pulse">
      Saving interview results... 
    </div>
    <button class="px-6 py-3 text-lg font-semibold text-white bg-green-600 cursor-pointer rounded-xl disabled:opacity-50" (click)="proceedNext()" [disabled]="isSaving">
      {{ isSaving ? 'Processing...' : 'Continue to Proceed' }}
    </button>
  </div>
</div>
